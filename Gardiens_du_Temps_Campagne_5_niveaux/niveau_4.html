   const mode=player.attackTime>0?'attack':!player.onGround?'jump':Math.abs(player.vx)>30?'run':'idle';
   const counts={idle:6,run:6,jump:5,attack:5};
   const frame=Math.floor(time*(mode==='run'?12:mode==='attack'?15:8))%counts[mode];
   c.save();if(player.facing<0){c.translate(Math.round(player.x-cam+player.w),0);c.scale(-1,1);pic('kael_'+mode+'_'+frame,-17,player.y-35,player.w+46,player.h+41)}
   else pic('kael_'+mode+'_'+frame,player.x-cam-17,player.y-35,player.w+46,player.h+41);
   c.restore();
 }
}
